# Tiny Tapeout project information
project:
  title:        "Tick Protocol Emulator"
  author:       "Lars Nitschke"
  discord:      ""
  description:  "Programmable protocol emulator with deadline/tick timing (Jane Street competition)"
  language:     "SystemVerilog"
  clock_hz:     50000000

  # Jane Street protocol-emulator allocation (competition post, confirmed 6x4).
  tiles: "6x4"

  top_module:  "tt_um_larsnitschke_tick"

  source_files:
    - "host_fifo.sv"
    - "tick_imem.sv"
    - "tick_cfg.sv"
    - "tick_timer.sv"
    - "tick_events.sv"
    - "tick_queue.sv"
    - "tick_issue.sv"
    - "tick_core.sv"
    - "host_spi.sv"
    - "tt_um_larsnitschke_tick.sv"

pinout:
  ui[0]: "SCLK"
  ui[1]: "MOSI"
  ui[2]: "CS_n"
  ui[3]: "RESERVED"
  ui[4]: "RESERVED"
  ui[5]: "RESERVED"
  ui[6]: "RESERVED"
  ui[7]: "RESERVED"
  uo[0]: "MISO"
  uo[1]: "IRQ"
  uo[2]: "RUN"
  uo[3]: "ERR"
  uo[4]: "MISS"
  uo[5]: "TICK"
  uo[6]: "RESERVED"
  uo[7]: "RESERVED"
  uio[0]: "PROTO0"
  uio[1]: "PROTO1"
  uio[2]: "PROTO2"
  uio[3]: "PROTO3"
  uio[4]: "PROTO4"
  uio[5]: "PROTO5"
  uio[6]: "PROTO6"
  uio[7]: "PROTO7"

yaml_version: 6
