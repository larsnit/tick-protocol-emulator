[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tick"
version = "0.2.0"
description = "Tick protocol-emulator ISA: assembler and cycle-accurate ISS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Lars Nitschke" }]
dependencies = [
    "pytest>=8.0",
    "cocotb>=2.0",
]

[tool.setuptools.packages.find]
where = ["sw"]

[tool.pytest.ini_options]
pythonpath = ["sw", "verification/model"]
testpaths = ["verification/model"]
